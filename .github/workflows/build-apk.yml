name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WordBook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WordBook-apk
          path: WordBook.apk

      # Publishes each build on the Releases page so the APK can be downloaded straight to a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 단어장 빌드 ${{ github.run_number }}
          body: 휴대폰에서 아래 WordBook.apk를 눌러 받고 설치하세요.
          files: WordBook.apk
          make_latest: true
