name: Device checks

# Run by hand: on an emulator, runs the instrumented tests (진도 초기화, evening report alarm) and the
# two-device sync check, then publishes the results as a pre-release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p results
            adb shell wm size 1080x2340 && adb shell wm density 420
            ./gradlew connectedDebugAndroidTest > results/instrumented.txt 2>&1 || echo "INSTRUMENTED TESTS FAILED" >> results/instrumented.txt
            cp -r app/build/reports/androidTests/connected results/instrumented-report || true
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            python3 tools/sync_check.py results
            adb logcat -d -s WBSync AndroidRuntime > results/logcat.txt

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr device-checks.zip results
          gh release create device-checks-${{ github.run_number }} device-checks.zip -R ${{ github.repository }} \
            --prerelease --latest=false --title "기기 점검 ${{ github.run_number }}" --notes "개발용 점검 결과"
